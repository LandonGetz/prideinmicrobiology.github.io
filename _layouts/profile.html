<!DOCTYPE html>
<html>
{% include head.html %}

<body id="page-top" class="index blog">
  {% include profile_nav.html %}
  <header>
    <div class="container" style="padding-top: 200px;">
      <div class="row">
        <div class="col-lg-12 text-center">
          <h1 style="color: #834cbc;">{{ page.title }}</h1>
        </div>
      </div>
    </div>
    <div class="container" style="padding-top: 25px;">
      <div class="row profile-header-row" style="margin-left: 10%; margin-right:10%">
        <div class="col-sm-6">
          <img src="{{ site.url }}/img/portfolio/{{ page.img }}" class="img-responsive" alt="{{ page.alt }}" width="100%" height="100%">
        </div>
        <div class="col-sm-6 profile-info-column">
          <div class="profile-info">
            <div class="info-row">
              <h4 style="color:#834cbc; display: inline;">Degree Held: </h4> 
              <h4 style="display: inline; color: black;">{{ page.degree-held }}</h4>
            </div>
            <div class="info-row">
              <h4 style="color:#834cbc; display: inline;">Current Position: </h4> 
              <h4 style="display: inline; color: black;">{{ page.position }}</h4>
            </div>
            <div class="info-row">
              <h4 style="color:#834cbc; display: inline;">Pronouns: </h4> 
              <h4 style="display: inline; color: black;">{{ page.pronouns }}</h4>
            </div>
            <div class="info-row">
              <h4 style="color:#834cbc; display: inline;">Identity: </h4> 
              <h4 style="display: inline; color: black;">{{ page.identity }}</h4>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>
  
  <div class="container">
    <div class="row" style="margin-left: 10%; margin-right: 10%;">
      <div class="col-lg-12">
        <div class="profile-content" style="color: black;">
          {{ content }}
        </div>
      </div>
    </div>
    <div class="row" style="padding: 25px;"></div>
  </div>
  {% include footer.html %}
</body>
</html>
